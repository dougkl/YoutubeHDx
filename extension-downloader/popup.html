<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>YoutubeHDx</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>YoutubeHDx Downloader</strong>
  </header>

  <p id="login" class="login muted">Checking YouTube sign-in…</p>

  <section id="actions">
    <p id="hint" class="muted">Open a YouTube video or playlist.</p>
    <button id="dl-video" hidden>Download this video in 4K</button>
    <button id="dl-playlist" hidden>Download whole playlist</button>
    <button id="watch-playlist" class="secondary" hidden>Auto-sync this playlist</button>
    <p id="result" role="status"></p>
  </section>

  <section id="pausebar" hidden>
    <div id="pause-idle">
      <h2>Need the bandwidth? Pause downloads</h2>
      <div class="pause-row">
        <button class="secondary" data-minutes="15">15 min</button>
        <button class="secondary" data-minutes="60">1 h</button>
        <button class="secondary" data-minutes="180">3 h</button>
        <button class="secondary" data-minutes="0">Until resumed</button>
      </div>
    </div>
    <div id="pause-active" class="paused" hidden>
      <span id="pause-text">Paused</span>
      <button id="resume">Resume now</button>
    </div>
  </section>

  <section>
    <h2>Downloads</h2>
    <ul id="jobs"><li class="muted">Loading…</li></ul>
  </section>

  <script src="popup.js"></script>
</body>
</html>
